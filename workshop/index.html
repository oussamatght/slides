<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop - Full Stack Web Development</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #0a0f1a;
            --bg-card: #111827;
            --fg: #f1f5f9;
            --muted: #64748b;
            --accent: #22d3ee;
            --accent-2: #a78bfa;
            --accent-warm: #fbbf24;
            --border: #1e293b;
            --code-bg: #1a1f2e;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            margin: 0;
            overflow: hidden;
        }
        
        code,
        pre,
        .code-block {
            font-family: 'JetBrains Mono', monospace;
        }
        
        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 211, 238, 0.15), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(167, 139, 250, 0.12), transparent), linear-gradient(180deg, var(--bg) 0%, #0d1424 100%);
        }
        
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        
        .slides-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 2rem 8rem;
            opacity: 0;
            transform: translateX(100px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }
        
        .slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        
        .slide.prev {
            transform: translateX(-100px);
        }
        
        @media (prefers-reduced-motion: reduce) {
            .slide {
                transition: opacity 0.3s ease;
                transform: none !important;
            }
        }
        
        .slide-content {
            max-width: 980px;
            width: 100%;
            max-height: calc(100vh - 12rem);
            overflow-y: auto;
            padding-right: 0.35rem;
        }
        
        .slide-content::-webkit-scrollbar {
            width: 10px;
        }
        
        .slide-content::-webkit-scrollbar-track {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.18), rgba(30, 41, 59, 0.22));
            border-radius: 999px;
        }
        
        .slide-content::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(34, 211, 238, 0.9), rgba(167, 139, 250, 0.9));
            border-radius: 999px;
            border: 2px solid rgba(15, 23, 42, 0.55);
        }
        
        .slide-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #22d3ee, #a78bfa);
        }
        
        .slide-number {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .slide-title {
            font-size: clamp(2rem, 5vw, 3.3rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, var(--fg) 0%, var(--accent-2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .section-title {
            font-size: clamp(2.4rem, 6vw, 4.2rem);
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .section-subtitle {
            font-size: 1.2rem;
            color: var(--muted);
            text-align: center;
        }
        
        .lead {
            color: #cbd5e1;
            line-height: 1.8;
            font-size: 1.03rem;
            margin-bottom: 1rem;
        }
        
        .bullet-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .bullet-list li {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 0.95rem;
            font-size: 1.12rem;
            line-height: 1.55;
        }
        
        .bullet-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.65em;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 2px;
            transform: rotate(45deg);
        }
        
        .accent {
            color: var(--accent);
            font-weight: 600;
        }
        
        .accent-2 {
            color: var(--accent-2);
            font-weight: 600;
        }
        
        .chip-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1.4rem;
        }
        
        .chip {
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid rgba(34, 211, 238, 0.35);
            color: #7dd3fc;
            background: rgba(34, 211, 238, 0.09);
            border-radius: 999px;
            padding: 0.35rem 0.8rem;
        }
        
        .note-box {
            background: rgba(167, 139, 250, 0.1);
            border: 1px dashed rgba(167, 139, 250, 0.35);
            border-radius: 10px;
            padding: 1rem 1.1rem;
            margin-top: 1.1rem;
            color: #d8b4fe;
            line-height: 1.6;
        }
        
        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            overflow-x: auto;
            font-size: 0.93rem;
            line-height: 1.7;
            position: relative;
        }
        
        .code-block::-webkit-scrollbar {
            height: 8px;
        }
        
        .code-block::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.35);
            border-radius: 999px;
        }
        
        .code-block::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.92), rgba(167, 139, 250, 0.88));
            border-radius: 999px;
        }
        
        .code-lang {
            position: absolute;
            top: 0.7rem;
            right: 0.95rem;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(to top, var(--bg), transparent);
            padding: 2rem;
        }
        
        .nav-inner {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        
        .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-warm));
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--fg);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .nav-btn:hover {
            border-color: var(--accent);
            background: rgba(34, 211, 238, 0.08);
        }
        
        .nav-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        
        .nav-btn:disabled:hover {
            border-color: var(--border);
            background: var(--bg-card);
        }
        
        .slide-counter {
            font-size: 0.875rem;
            color: var(--muted);
            min-width: 60px;
            text-align: center;
        }
        
        .keyboard-hint {
            position: fixed;
            bottom: 6rem;
            right: 2rem;
            font-size: 0.75rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .section-icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 1.45rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        
        kbd {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            font-family: inherit;
            font-size: 0.7rem;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .slide.active .slide-content>* {
            animation: fadeInUp 0.5s ease forwards;
        }
        
        .slide.active .slide-content>*:nth-child(1) {
            animation-delay: 0.1s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(2) {
            animation-delay: 0.2s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(3) {
            animation-delay: 0.3s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(4) {
            animation-delay: 0.4s;
            opacity: 0;
        }
        
        @media (prefers-reduced-motion: reduce) {
            .slide.active .slide-content>* {
                animation: none;
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .slide {
                padding: 1rem 1rem 8rem;
            }
            .slide-title {
                font-size: 1.8rem;
            }
            .section-title {
                font-size: clamp(1.9rem, 8vw, 2.7rem);
            }
            .section-subtitle {
                font-size: 1rem;
            }
            .bullet-list li {
                font-size: 0.98rem;
                padding-left: 1.5rem;
                margin-bottom: 0.7rem;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 1rem;
            }
            .slide-content {
                max-height: calc(100vh - 11rem);
                padding-right: 0.2rem;
            }
            .nav-inner {
                flex-wrap: wrap;
                padding: 1rem;
            }
            .nav-btn {
                padding: 0.5rem 1rem;
                font-size: 0.75rem;
            }
            .slide-counter {
                font-size: 0.75rem;
            }
            .keyboard-hint {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="bg-pattern"></div>
    <div class="grid-overlay"></div>

    <div class="slides-container" id="slidesContainer"></div>

    <div class="keyboard-hint">
        <kbd>←</kbd> <kbd>→</kbd> to navigate
    </div>

    <nav class="nav-bar" role="navigation" aria-label="Slide navigation">
        <div class="nav-inner">
            <button class="nav-btn" id="prevBtn" aria-label="Previous slide">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="15 18 9 12 15 6"></polyline>
				</svg>
				Prev
			</button>
            <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Slide progress">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="slide-counter" id="slideCounter">1 / 1</span>
            <button class="nav-btn" id="nextBtn" aria-label="Next slide">
				Next
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="9 18 15 12 9 6"></polyline>
				</svg>
			</button>
        </div>
    </nav>

    <script>
        const sectionNumbers = {
            fundamentals: '0',

            why: '2',
            tools: '3',
            frontend: '4',
            backend: '5',

        const slides = [{
                type: 'title',

                    '8. Next.js: Modern Full Stack Framework',

                ]
            },

            // 0. FUNDAMENTALS

  const token = authHeader?.split(' ')[1];

        const container = document.getElementById('slidesContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');
        const slideCounter = document.getElementById('slideCounter');

        let currentSlide = 0;

        function escapeHtml(input) {
            return input
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function renderSlides() {
            container.innerHTML = '';

            slides.forEach((slide, index) => {
                const slideEl = document.createElement('div');
                slideEl.className = 'slide';
                slideEl.setAttribute('role', 'group');
                slideEl.setAttribute('aria-label', `Slide ${index + 1} of ${slides.length}`);

                if (index === currentSlide) {
                    slideEl.classList.add('active');
                } else if (index < currentSlide) {
                    slideEl.classList.add('prev');
                }

                slideEl.innerHTML = renderSlideContent(slide);
                container.appendChild(slideEl);
            });

            updateNav();
        }

        function renderSlideContent(slide) {
            switch (slide.type) {
                case 'title':
                    return `
						<div class="slide-content text-center">
							<div class="section-icon">
								<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
							</div>
							<h1 class="section-title">${slide.title}</h1>
							<p class="section-subtitle">${slide.subtitle}</p>
							<p class="lead" style="max-width: 850px; margin: 1rem auto 0;">${slide.audience}</p>
							<div class="chip-wrap" style="justify-content: center;">
								${slide.stack.map(item => `<span class="chip">${item}</span>`).join('')}
							</div>
							<p style="margin-top: 2.5rem; color: var(--muted);">Press <kbd>→</kbd> or click Next to begin</p>
						</div>
					`;

				case 'section':
					return `
						<div class="slide-content text-center">
							<p class="slide-number">${slide.section ? `Module ${sectionNumbers[slide.section]}` : 'Workshop Index'}</p>
							<h1 class="section-title">${slide.title}</h1>
							<p class="section-subtitle">${slide.subtitle}</p>
						</div>
					`;

				case 'explain':
					return `
						<div class="slide-content">
							<p class="slide-number">${slide.label || 'Concept'}</p>
							<h2 class="slide-title">${slide.title}</h2>
							${slide.lead ? `<p class="lead">${slide.lead}</p>` : ''}
							<ul class="bullet-list">
								${(slide.bullets || []).map(item => `<li>${item}</li>`).join('')}
							</ul>
							${slide.note ? `<div class="note-box">${slide.note}</div>` : ''}
						</div>
					`;

				case 'code':
					return `
						<div class="slide-content">
							<p class="slide-number">Code Example</p>
							<h2 class="slide-title">${slide.title}</h2>
							<div class="code-block">
								<span class="code-lang">${slide.lang || 'CODE'}</span>
								<pre style="margin: 0;"><code>${escapeHtml(slide.code)}</code></pre>
							</div>
						</div>
					`;

				case 'final':
					return `
						<div class="slide-content text-center">
							<div class="section-icon" style="background: linear-gradient(135deg, #22d3ee, #34d399);">
								<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
							</div>
							<h1 class="section-title">${slide.title}</h1>
							<p class="section-subtitle" style="margin-bottom: 2rem;">${slide.subtitle}</p>
							<ul class="bullet-list" style="text-align: left; max-width: 760px; margin: 0 auto;">
								${slide.bullets.map(item => `<li>${item}</li>`).join('')}
							</ul>
						</div>
					`;

				case 'challenge':
					return `
						<div class="slide-content">
							<p class="slide-number">Next Steps</p>
							<h2 class="slide-title">${slide.title}</h2>
							<p class="section-subtitle" style="text-align: left; margin-bottom: 1.2rem;">${slide.subtitle}</p>
							<ul class="bullet-list">
								${slide.bullets.map(item => `<li>${item}</li>`).join('')}
							</ul>
							${slide.note ? `<div class="note-box">${slide.note}</div>` : ''}
						</div>
					`;

				default:
					return '';
			}
		}

		function updateNav() {
			const total = slides.length;
			const progress = ((currentSlide + 1) / total) * 100;

			progressFill.style.width = `${progress}%`;
			slideCounter.textContent = `${currentSlide + 1} / ${total}`;

			prevBtn.disabled = currentSlide === 0;
			nextBtn.disabled = currentSlide === total - 1;
		}

		function goToSlide(index) {
			if (index < 0 || index >= slides.length) return;

			const allSlides = container.querySelectorAll('.slide');

			allSlides.forEach((slideEl, i) => {
				slideEl.classList.remove('active', 'prev');
				if (i === index) {
					slideEl.classList.add('active');
				} else if (i < index) {
					slideEl.classList.add('prev');
				}
			});

			currentSlide = index;
			updateNav();
		}

		function nextSlide() {
			goToSlide(currentSlide + 1);
		}

		function prevSlide() {
			goToSlide(currentSlide - 1);
		}

		prevBtn.addEventListener('click', prevSlide);
		nextBtn.addEventListener('click', nextSlide);

		document.addEventListener('keydown', (event) => {
			if (event.key === 'ArrowRight' || event.key === ' ') {
				event.preventDefault();
				nextSlide();
			} else if (event.key === 'ArrowLeft') {
				event.preventDefault();
				prevSlide();
			}
		});

		let touchStartX = 0;
		let touchEndX = 0;

		container.addEventListener('touchstart', (event) => {
			touchStartX = event.changedTouches[0].screenX;
		}, {
			passive: true
		});

		container.addEventListener('touchend', (event) => {
			touchEndX = event.changedTouches[0].screenX;
			const diff = touchStartX - touchEndX;

			if (Math.abs(diff) > 50) {
				if (diff > 0) {
					nextSlide();
				} else {
					prevSlide();
				}
			}
		}, {
			passive: true
		});

		renderSlides();
    </script>
