<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML for Beginners - Interactive Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #0a0f1a;
            --bg-card: #111827;
            --fg: #f1f5f9;
            --muted: #64748b;
            --accent: #22d3ee;
            --accent-warm: #fbbf24;
            --border: #1e293b;
            --code-bg: #1a1f2e;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            margin: 0;
            overflow: hidden;
        }
        
        code,
        pre,
        .code-block {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Animated background */
        
        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 211, 238, 0.15), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(251, 191, 36, 0.1), transparent), linear-gradient(180deg, var(--bg) 0%, #0d1424 100%);
        }
        
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        /* Slide container */
        
        .slides-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            opacity: 0;
            transform: translateX(100px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }
        
        .slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        
        .slide.prev {
            transform: translateX(-100px);
        }
        
        @media (prefers-reduced-motion: reduce) {
            .slide {
                transition: opacity 0.3s ease;
                transform: none !important;
            }
        }
        
        .slide-content {
            max-width: 900px;
            width: 100%;
        }
        /* Typography */
        
        .slide-number {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .slide-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .section-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .section-subtitle {
            font-size: 1.25rem;
            color: var(--muted);
            text-align: center;
        }
        /* Content styles */
        
        .bullet-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .bullet-list li {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 1rem;
            font-size: 1.25rem;
            line-height: 1.6;
        }
        
        .bullet-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.6em;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 2px;
            transform: rotate(45deg);
        }
        
        .accent {
            color: var(--accent);
            font-weight: 600;
        }
        
        .accent-warm {
            color: var(--accent-warm);
            font-weight: 600;
        }
        /* Code blocks */
        
        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            overflow-x: auto;
            font-size: 0.95rem;
            line-height: 1.7;
            position: relative;
        }
        
        .code-block::before {
            content: 'HTML';
            position: absolute;
            top: 0.75rem;
            right: 1rem;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.1em;
        }
        
        .tag {
            color: #f472b6;
        }
        
        .attr {
            color: #a78bfa;
        }
        
        .value {
            color: #34d399;
        }
        
        .content {
            color: var(--fg);
        }
        
        .comment {
            color: var(--muted);
            font-style: italic;
        }
        /* Exercise boxes */
        
        .exercise-box {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1) 0%, rgba(251, 191, 36, 0.05) 100%);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
        }
        
        .exercise-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-warm);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.75rem;
        }
        /* Navigation */
        
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(to top, var(--bg), transparent);
            padding: 2rem;
        }
        
        .nav-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        
        .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-warm));
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--fg);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .nav-btn:hover {
            border-color: var(--accent);
            background: rgba(34, 211, 238, 0.1);
        }
        
        .nav-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .nav-btn:disabled:hover {
            border-color: var(--border);
            background: var(--bg-card);
        }
        /* Slide counter */
        
        .slide-counter {
            font-size: 0.875rem;
            color: var(--muted);
            min-width: 60px;
            text-align: center;
        }
        /* Instructor notes */
        
        .instructor-note {
            background: rgba(34, 211, 238, 0.1);
            border-left: 3px solid var(--accent);
            padding: 1rem 1.25rem;
            margin-top: 1.5rem;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: var(--muted);
        }
        
        .instructor-note strong {
            color: var(--accent);
        }
        /* Analogy box */
        
        .analogy-box {
            background: rgba(167, 139, 250, 0.1);
            border: 1px dashed rgba(167, 139, 250, 0.4);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin: 1rem 0;
        }
        
        .analogy-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }
        /* Section divider */
        
        .section-divider {
            text-align: center;
            padding: 1rem 0;
        }
        
        .section-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-warm));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        /* Animations */
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .slide.active .slide-content>* {
            animation: fadeInUp 0.5s ease forwards;
        }
        
        .slide.active .slide-content>*:nth-child(1) {
            animation-delay: 0.1s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(2) {
            animation-delay: 0.2s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(3) {
            animation-delay: 0.3s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(4) {
            animation-delay: 0.4s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(5) {
            animation-delay: 0.5s;
            opacity: 0;
        }
        
        @media (prefers-reduced-motion: reduce) {
            .slide.active .slide-content>* {
                animation: none;
                opacity: 1;
            }
        }
        /* Keyboard hint */
        
        .keyboard-hint {
            position: fixed;
            bottom: 6rem;
            right: 2rem;
            font-size: 0.75rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .lang-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 120;
            padding: 0.45rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--fg);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        .lang-ar .slide-content {
            direction: rtl;
            text-align: right;
        }
        
        .lang-ar .bullet-list li {
            padding-left: 0;
            padding-right: 2rem;
        }
        
        .lang-ar .bullet-list li::before {
            left: auto;
            right: 0;
        }
        
        .lang-ar pre,
        .lang-ar code,
        .lang-ar .code-block {
            direction: ltr;
            text-align: left;
        }
        
        kbd {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            font-family: inherit;
            font-size: 0.7rem;
        }
        /* Responsive */
        
        @media (max-width: 640px) {
            .slide {
                padding: 1rem;
            }
            .slide-title {
                font-size: 1.75rem;
            }
            .bullet-list li {
                font-size: 1rem;
                padding-left: 1.5rem;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 1rem;
            }
            .nav-inner {
                flex-wrap: wrap;
            }
            .keyboard-hint {
                display: none;
            }
            .lang-toggle {
                padding: 0.35rem 0.6rem;
                font-size: 0.75rem;
                top: 0.5rem;
                right: 0.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-pattern"></div>
    <div class="grid-overlay"></div>

    <div class="slides-container" id="slidesContainer">
        <!-- Slide data will be injected here -->
    </div>

    <div class="keyboard-hint">
        <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate
    </div>

    <button id="langToggleBtn" class="lang-toggle" aria-label="Toggle Arabic language">AR</button>

    <nav class="nav-bar" role="navigation" aria-label="Slide navigation">
        <div class="nav-inner">
            <button class="nav-btn" id="prevBtn" aria-label="Previous slide">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Prev
      </button>
            <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Slide progress">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="slide-counter" id="slideCounter">1 / 1</span>
            <button class="nav-btn" id="nextBtn" aria-label="Next slide">
        Next
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
        </div>
    </nav>

    <script>
        // Slide data
        const slides = [
            // === TITLE SLIDE ===
            {
                type: 'title',
                title: 'HTML for Beginners',
                subtitle: 'Learn to build web pages from scratch',
                section: 'start'
            },

            // === SECTION: HTML BASICS ===
            {
                type: 'section',
                title: 'HTML Basics',
                subtitle: 'Understanding the foundation of web pages',
                section: 'basics'
            },

            // What is HTML?
            {
                type: 'explain',
                section: 'basics',
                title: 'What is HTML?',
                content: [
                    'HTML is the language used to create <span class="accent">web pages</span>',
                    'It tells the browser what content to show',
                    'HTML uses <span class="accent">tags</span> to structure content'
                ],
                analogy: 'Think of HTML like the skeleton of a house. It gives structure, but needs CSS (paint/decor) and JavaScript (electricity) to be complete.',
                instructorNote: 'Common mistake: Students often confuse HTML with a programming language. Clarify that HTML is a markup language - it describes structure, not logic.'
            },

            {
                type: 'code',
                section: 'basics',
                title: 'Your First HTML Page',
                code: `<!DOCTYPE html>
<html>
  <head>
     <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First Page</title>
  </head>
  <body>
    Hello World!
  </body>
</html>`
            },

            {
                type: 'exercise',
                section: 'basics',
                title: 'Practice: Create Your First Page',
                exercise: 'Create an HTML file with the basic structure. Add your name between the body tags.',
                hint: 'Save the file as "index.html" and open it in your browser.'
            },

            // HTML Tags
            {
                type: 'explain',
                section: 'basics',
                title: 'HTML Tags',
                content: [
                    'Tags are the building blocks of HTML',
                    'Most tags have an <span class="accent">opening</span> and <span class="accent">closing</span> tag',
                    'Tags tell the browser what each piece of content is'
                ],
                analogy: 'Tags are like labeled boxes. You put content inside, and the label tells everyone what is inside.'
            },

            {
                type: 'code',
                section: 'basics',
                title: 'How Tags Work',
                code: `<p>This is a paragraph.</p>
<h1>This is a heading.</h1>
<b>This text is bold.</b>

<!-- Self-closing tags -->
<img src="photo.jpg">
<br>`
            },

            {
                type: 'exercise',
                section: 'basics',
                title: 'Practice: Match the Tags',
                exercise: 'Write the correct closing tag for each opening tag: <code>&lt;p&gt;</code> <code>&lt;h2&gt;</code> <code>&lt;div&gt;</code>',
                hint: 'Remember: closing tags have a forward slash: </tagname>'
            },

            // HTML Elements
            {
                type: 'explain',
                section: 'basics',
                title: 'HTML Elements',
                content: [
                    'An element = opening tag + content + closing tag',
                    'Some elements have <span class="accent">no content</span> (self-closing)',
                    'Elements can be <span class="accent">nested</span> inside other elements'
                ]
            },

            {
                type: 'code',
                section: 'basics',
                title: 'Nested Elements',
                code: `<body>
  <h1>Welcome</h1>
  <p>
    This is <b>important</b> text.
  </p>
</body>`
            },

            {
                type: 'exercise',
                section: 'basics',
                title: 'Practice: Build a Paragraph',
                exercise: 'Create a paragraph element that contains one bold word and one italic word.',
                hint: 'Use <b> for bold and <i> for italic.'
            },

            // HTML Attributes
            {
                type: 'explain',
                section: 'basics',
                title: 'HTML Attributes',
                content: [
                    'Attributes add <span class="accent">extra information</span> to elements',
                    'They go in the <span class="accent">opening tag</span>',
                    'Format: <code>name="value"</code>'
                ],
                analogy: 'Attributes are like adjectives. Just as "red car" gives more info about the car, attributes give more info about HTML elements.',
                instructorNote: 'Common mistake: Forgetting quotes around attribute values. Always use quotes!'
            },

            {
                type: 'code',
                section: 'basics',
                title: 'Attributes in Action',
                code: `<img src="cat.jpg" alt="A cute cat">
<a href="https://google.com">Go to Google</a>
<p id="intro">Welcome to my site!</p>`
            },

            {
                type: 'exercise',
                section: 'basics',
                title: 'Practice: Add Attributes',
                exercise: 'Add an id attribute with value "main-title" to an h1 element.',
                hint: 'The format is: id="main-title"'
            },

            // === SECTION: TEXT & HEADINGS ===
            {
                type: 'section',
                title: 'Text & Headings',
                subtitle: 'Organizing and styling your content',
                section: 'text'
            },

            // Headings
            {
                type: 'explain',
                section: 'text',
                title: 'HTML Headings',
                content: [
                    'HTML has <span class="accent">6 levels</span> of headings: h1 to h6',
                    '<code>h1</code> is the largest and most important',
                    'Use headings to create a <span class="accent">hierarchy</span> of content'
                ],
                instructorNote: 'Stress that headings are not just about size - they define document structure for screen readers and SEO.'
            },

            {
                type: 'code',
                section: 'text',
                title: 'Heading Levels',
                code: `<h1>Main Title</h1>
<h2>Section Title</h2>
<h3>Subsection</h3>
<h4>Sub-subsection</h4>
<h5>Minor heading</h5>
<h6>Smallest heading</h6>`
            },

            {
                type: 'exercise',
                section: 'text',
                title: 'Practice: Structure a Page',
                exercise: 'Create a page about your favorite food. Use h1 for the main title and h2 for sections like "Why I Love It" and "Recipe".',
                hint: 'Only use one h1 per page for best practices.'
            },

            // Paragraphs
            {
                type: 'explain',
                section: 'text',
                title: 'Paragraphs',
                content: [
                    'Use <code>p</code> tags for blocks of text',
                    'Browsers add <span class="accent">space</span> between paragraphs',
                    'Each paragraph should contain one main idea'
                ]
            },

            {
                type: 'code',
                section: 'text',
                title: 'Writing Paragraphs',
                code: `<p>This is my first paragraph. It talks about HTML.</p>

<p>This is my second paragraph. It talks about CSS.</p>

<p>Notice how each paragraph has space around it.</p>`
            },

            {
                type: 'exercise',
                section: 'text',
                title: 'Practice: Write About Yourself',
                exercise: 'Write 2-3 paragraphs about yourself. Use proper paragraph tags.',
                hint: 'Keep each paragraph focused on one topic.'
            },

            // Formatting
            {
                type: 'explain',
                section: 'text',
                title: 'Text Formatting',
                content: [
                    '<code>b</code> makes text <b>bold</b>',
                    '<code>i</code> makes text <i>italic</i>',
                    '<code>u</code> makes text <u>underlined</u>',
                    '<code>strong</code> and <code>em</code> add meaning, not just style'
                ]
            },

            {
                type: 'code',
                section: 'text',
                title: 'Formatting Tags',
                code: `<p>This is <b>bold</b> text.</p>
<p>This is <i>italic</i> text.</p>
<p>This is <u>underlined</u> text.</p>
<p><strong>Important:</strong> Read carefully!</p>
<p><em>Note:</em> This is emphasized.</p>`
            },

            {
                type: 'exercise',
                section: 'text',
                title: 'Practice: Format a Sentence',
                exercise: 'Write a sentence where one word is bold, one is italic, and one is both.',
                hint: 'You can nest tags: <b><i>text</i></b>'
            },

            // Comments
            {
                type: 'explain',
                section: 'text',
                title: 'HTML Comments',
                content: [
                    'Comments are <span class="accent">not visible</span> on the page',
                    'They help you leave notes in your code',
                    'Great for organizing and explaining your work'
                ],
                analogy: 'Comments are like sticky notes for developers. Readers of your webpage never see them, but you and other developers can.'
            },

            {
                type: 'code',
                section: 'text',
                title: 'Writing Comments',
                code: `<!-- This is a comment. It won't show on the page. -->

<p>Hello World!</p>

<!-- TODO: Add more content here -->`
            },

            {
                type: 'exercise',
                section: 'text',
                title: 'Practice: Add Comments',
                exercise: 'Add comments to your previous exercise explaining what each section does.',
                hint: 'Comment syntax: <!-- your note here -->'
            },

            // === SECTION: LINKS & IMAGES ===
            {
                type: 'section',
                title: 'Links & Images',
                subtitle: 'Connecting pages and adding visuals',
                section: 'links'
            },

            // Links
            {
                type: 'explain',
                section: 'links',
                title: 'HTML Links',
                content: [
                    'Links let users <span class="accent">navigate</span> between pages',
                    'The <code>a</code> tag creates a link',
                    'The <code>href</code> attribute specifies the destination'
                ],
                analogy: 'Links are like doors. The href attribute tells the browser which door to open and where it leads.'
            },

            {
                type: 'code',
                section: 'links',
                title: 'Creating Links',
                code: `<a href="https://google.com">Go to Google</a>

<a href="about.html">About Us</a>

<a href="contact.html">Contact Page</a>`
            },

            {
                type: 'exercise',
                section: 'links',
                title: 'Practice: Create Navigation',
                exercise: 'Create 3 links: one to Google, one to Wikipedia, and one to your favorite website.',
                hint: 'Remember to include https:// in external URLs.'
            },

            // Images
            {
                type: 'explain',
                section: 'links',
                title: 'HTML Images',
                content: [
                    'The <code>img</code> tag displays images',
                    'It is <span class="accent">self-closing</span> (no end tag)',
                    'Always include the <code>alt</code> attribute for accessibility'
                ],
                instructorNote: 'Emphasize alt text. It helps visually impaired users understand images and displays if the image fails to load.'

        function t(text) {
            if (currentLang !== 'ar') return text;
            return arMap[text] || text;
        }

        function localizeSlide(slide) {
            if (currentLang !== 'ar') return slide;
            const out = {
                ...slide
            };

            if (out.title) out.title = t(out.title);
            if (out.subtitle) out.subtitle = t(out.subtitle);
            if (out.analogy) out.analogy = t(out.analogy);
            if (out.instructorNote) out.instructorNote = t(out.instructorNote);
            if (out.exercise) out.exercise = t(out.exercise);
            if (out.hint) out.hint = t(out.hint);
            if (Array.isArray(out.content)) out.content = out.content.map(item => t(item));

            return out;
        }

        // Render slides
        function renderSlides() {
            container.innerHTML = '';

            slides.forEach((slide, index) => {
                const localized = localizeSlide(slide);
                const slideEl = document.createElement('div');
                slideEl.className = 'slide';
                slideEl.setAttribute('role', 'group');
                slideEl.setAttribute('aria-label', `Slide ${index + 1} of ${slides.length}`);

                if (index === currentSlide) {
                    slideEl.classList.add('active');
                } else if (index < currentSlide) {
                    slideEl.classList.add('prev');
                }

                slideEl.innerHTML = renderSlideContent(localized, index);
                container.appendChild(slideEl);
            });

            updateNav();
            document.body.classList.toggle('lang-ar', currentLang === 'ar');
        }

                case 'title':

              </div>
              <h1 class="section-title">${slide.title}</h1>
              <p class="section-subtitle">${slide.subtitle}</p>
                            <p style="margin-top: 3rem; color: var(--muted);">${uiText[currentLang].startHint}</p>
            </div>
          `;

                case 'section':
                    return `
            <div class="slide-content text-center">

                case 'explain':

              ` : ''}
            </div>
          `;
        
        case 'code':

                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                    ${uiText[currentLang].finalProject}
                </p>
                <p style="margin: 0; font-size: 1rem; white-space: pre-line;">${slide.exercise}</p>
              </div>
            </div>
          `;
        
        default:
          return '';
      }
    }

    function getSectionNumber(section) {
            const sections = ['start', 'basics', 'text', 'links', 'media', 'lists', 'forms', 'semantic'];
      const num = sections.indexOf(section);
      return num > 0 ? num : '';
    }

        function accentHTML(code) {
            const comments = [];

            let escaped = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            escaped = escaped.replace(/(&lt;!--[\s\S]*?--&gt;)/g, (match) => {
                const token = `__HTML_COMMENT_${comments.length}__`;
                comments.push(match);
                return token;
            });

            escaped = escaped.replace(/(&lt;\/?.*?&gt;)/g, (token) => {
                // Highlight attributes first on raw token text (before adding spans)
                let highlighted = token.replace(/(\s)([\w:-]+)(=)("[^"]*"|'[^']*')/g, '$1<span class="attr">$2</span>$3<span class="value">$4</span>');

                // Then highlight tag name; keeps generated span markup untouched
                highlighted = highlighted.replace(/^(&lt;\/?)([\w-]+)/, '$1<span class="tag">$2</span>');

                return highlighted;
            });

            comments.forEach((comment, index) => {
                escaped = escaped.replace(`__HTML_COMMENT_${index}__`, `<span class="comment">${comment}</span>`);
            });

            return escaped;
        }

    function updateNav() {
      const total = slides.length;
      const progress = ((currentSlide + 1) / total) * 100;
      
      progressFill.style.width = `${progress}%`;
      slideCounter.textContent = `${currentSlide + 1} / ${total}`;
      
      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === total - 1;
    }

    function goToSlide(index) {
      if (index < 0 || index >= slides.length) return;
      
      const allSlides = container.querySelectorAll('.slide');
      
      allSlides.forEach((slide, i) => {
        slide.classList.remove('active', 'prev');
        if (i === index) {
          slide.classList.add('active');
        } else if (i < index) {
          slide.classList.add('prev');
        }
      });
      
      currentSlide = index;
      updateNav();
    }

    function nextSlide() {
      goToSlide(currentSlide + 1);
    }

    function prevSlide() {
      goToSlide(currentSlide - 1);
    }

    // Event listeners
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            langToggleBtn.textContent = currentLang === 'en' ? 'AR' : 'EN';
            renderSlides();
            goToSlide(currentSlide);
        });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    // Touch support
    let touchStartX = 0;
    let touchEndX = 0;

    container.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    }

    // Initialize
    renderSlides();
    </script>
</body>
