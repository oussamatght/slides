<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML for Beginners - Interactive Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #0a0f1a;
            --bg-card: #111827;
            --fg: #f1f5f9;
            --muted: #64748b;
            --accent: #22d3ee;
            --accent-warm: #fbbf24;
            --border: #1e293b;
            --code-bg: #1a1f2e;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            margin: 0;
            overflow: hidden;
        }
        
        code,
        pre,
        .code-block {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Animated background */
        
        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 211, 238, 0.15), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(251, 191, 36, 0.1), transparent), linear-gradient(180deg, var(--bg) 0%, #0d1424 100%);
        }
        
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        /* Slide container */
        
        .slides-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 2rem 8.2rem;
            opacity: 0;
            transform: translateX(100px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }
        
        .slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        
        .slide.prev {
            transform: translateX(-100px);
        }
        
        @media (prefers-reduced-motion: reduce) {
            .slide {
                transition: opacity 0.3s ease;
                transform: none !important;
            }
        }
        
        .slide-content {
            max-width: 900px;
            width: 100%;
            max-height: calc(100vh - 12.2rem);
            overflow-y: auto;
            padding-right: 0.35rem;
        }
        
        .slide-content::-webkit-scrollbar {
            width: 10px;
        }
        
        .slide-content::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.26);
            border-radius: 999px;
        }
        
        .slide-content::-webkit-scrollbar-thumb {
            border-radius: 999px;
            border: 2px solid rgba(15, 23, 42, 0.55);
            background: linear-gradient(180deg, rgba(34, 211, 238, 0.95), rgba(251, 191, 36, 0.9));
        }
        
        .slide-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #22d3ee, #fbbf24);
        }
        /* Typography */
        
        .slide-number {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .slide-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--fg) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .section-title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .section-subtitle {
            font-size: 1.25rem;
            color: var(--muted);
            text-align: center;
        }
        /* Content styles */
        
        .bullet-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .bullet-list li {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 1rem;
            font-size: 1.25rem;
            line-height: 1.6;
        }
        
        .bullet-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.6em;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 2px;
            transform: rotate(45deg);
        }
        
        .accent {
            color: var(--accent);
            font-weight: 600;
        }
        
        .accent-warm {
            color: var(--accent-warm);
            font-weight: 600;
        }
        /* Code blocks */
        
        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            overflow-x: auto;
            font-size: 0.95rem;
            line-height: 1.7;
            position: relative;
        }
        
        .code-block::before {
            content: 'HTML';
            position: absolute;
            top: 0.75rem;
            right: 1rem;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.1em;
        }
        
        .tag {
            color: #f472b6;
        }
        
        .attr {
            color: #a78bfa;
        }
        
        .value {
            color: #34d399;
        }
        
        .content {
            color: var(--fg);
        }
        
        .comment {
            color: var(--muted);
            font-style: italic;
        }
        /* Exercise boxes */
        
        .exercise-box {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1) 0%, rgba(251, 191, 36, 0.05) 100%);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
        }
        
        .exercise-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-warm);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.75rem;
        }
        /* Navigation */
        
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(to top, var(--bg), transparent);
            padding: 2rem;
        }
        
        .nav-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        
        .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-warm));
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--fg);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .nav-btn:hover {
            border-color: var(--accent);
            background: rgba(34, 211, 238, 0.1);
        }
        
        .nav-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .nav-btn:disabled:hover {
            border-color: var(--border);
            background: var(--bg-card);
        }
        /* Slide counter */
        
        .slide-counter {
            font-size: 0.875rem;
            color: var(--muted);
            min-width: 60px;
            text-align: center;
        }
        /* Instructor notes */
        
        .instructor-note {
            background: rgba(34, 211, 238, 0.1);
            border-left: 3px solid var(--accent);
            padding: 1rem 1.25rem;
            margin-top: 1.5rem;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: var(--muted);
        }
        
        .instructor-note strong {
            color: var(--accent);
        }
        /* Analogy box */
        
        .analogy-box {
            background: rgba(167, 139, 250, 0.1);
            border: 1px dashed rgba(167, 139, 250, 0.4);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin: 1rem 0;
        }
        
        .analogy-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }
        /* Section divider */
        
        .section-divider {
            text-align: center;
            padding: 1rem 0;
        }
        
        .section-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-warm));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        /* Animations */
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .slide.active .slide-content>* {
            animation: fadeInUp 0.5s ease forwards;
        }
        
        .slide.active .slide-content>*:nth-child(1) {
            animation-delay: 0.1s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(2) {
            animation-delay: 0.2s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(3) {
            animation-delay: 0.3s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(4) {
            animation-delay: 0.4s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(5) {
            animation-delay: 0.5s;
            opacity: 0;
        }
        
        @media (prefers-reduced-motion: reduce) {
            .slide.active .slide-content>* {
                animation: none;
                opacity: 1;
            }
        }
        /* Keyboard hint */
        
        .keyboard-hint {
            position: fixed;
            bottom: 6rem;
            right: 2rem;
            font-size: 0.75rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .lang-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 120;
            padding: 0.45rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--fg);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        .lang-ar .slide-content {
            direction: rtl;
            text-align: right;
        }
        
        .lang-ar .bullet-list li {
            padding-left: 0;
            padding-right: 2rem;
        }
        
        .lang-ar .bullet-list li::before {
            left: auto;
            right: 0;
        }
        
        .lang-ar pre,
        .lang-ar code,
        .lang-ar .code-block {
            direction: ltr;
            text-align: left;
        }
        
        kbd {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            font-family: inherit;
            font-size: 0.7rem;
        }
        /* Responsive */
        
        @media (max-width: 640px) {
            .slide {
                padding: 1rem 1rem 9.2rem;
            }
            .slide-title {
                font-size: 1.75rem;
            }
            .bullet-list li {
                font-size: 1rem;
                padding-left: 1.5rem;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 1rem;
            }
            .slide-content {
                max-height: calc(100vh - 13.2rem);
                padding-right: 0.2rem;
            }
            .nav-inner {
                flex-wrap: wrap;
            }
            .keyboard-hint {
                display: none;
            }
            .lang-toggle {
                padding: 0.35rem 0.6rem;
                font-size: 0.75rem;
                top: 0.5rem;
                right: 0.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-pattern"></div>
    <div class="grid-overlay"></div>

    <div class="slides-container" id="slidesContainer">
        <!-- Slide data will be injected here -->
    </div>

    <div class="keyboard-hint">
        <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to navigate
    </div>

    <button id="langToggleBtn" class="lang-toggle" aria-label="Toggle Arabic language">AR</button>

    <nav class="nav-bar" role="navigation" aria-label="Slide navigation">
        <div class="nav-inner">
            <button class="nav-btn" id="prevBtn" aria-label="Previous slide">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Prev
      </button>
            <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Slide progress">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="slide-counter" id="slideCounter">1 / 1</span>
            <button class="nav-btn" id="nextBtn" aria-label="Next slide">
        Next
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
        </div>
    </nav>

    <script>
        // Slide data
        const slides = [
            // === TITLE SLIDE ===
            {
                type: 'title',
                title: 'HTML for Beginners',
                subtitle: 'Learn to build web pages from scratch',
                section: 'start'
            },

            // === SECTION: HTML BASICS ===
            {
                type: 'section',
                title: 'HTML Basics',
                subtitle: 'Understanding the foundation of web pages',
                section: 'basics'
            },

            // What is HTML?
            {
                type: 'explain',
                section: 'basics',
                title: 'What is HTML?',
                content: [
                    'HTML is the language used to create <span class="accent">web pages</span>',
                    'It tells the browser what content to show',
                    'HTML uses <span class="accent">tags</span> to structure content'
                ],
                analogy: 'Think of HTML like the skeleton of a house. It gives structure, but needs CSS (paint/decor) and JavaScript (electricity) to be complete.',
                instructorNote: 'Common mistake: Students often confuse HTML with a programming language. Clarify that HTML is a markup language - it describes structure, not logic.'
            },

            {
                type: 'code',
                section: 'basics',
                title: 'Your First HTML Page',
                code: `<!DOCTYPE html>
<html>
  <head>
     <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First Page</title>
  </head>
  <body>
    Hello World!
  </body>
</html>`
            },

            {
                type: 'exercise',
                section: 'basics',
                title: 'Practice: Create Your First Page',
                exercise: 'Create an HTML file with the basic structure. Add your name between the body tags.',
                hint: 'Save the file as "index.html" and open it in your browser.'
            },

            // HTML Tags
            {
                type: 'explain',
                section: 'basics',
                title: 'HTML Tags',
                content: [
                    'Tags are the building blocks of HTML',
                    'Most tags have an <span class="accent">opening</span> and <span class="accent">closing</span> tag',
                    'Tags tell the browser what each piece of content is'
                ],
                analogy: 'Tags are like labeled boxes. You put content inside, and the label tells everyone what is inside.'
            },

            {
                type: 'code',
                section: 'basics',
                title: 'How Tags Work',
                code: `<p>This is a paragraph.</p>
<h1>This is a heading.</h1>
<b>This text is bold.</b>

<!-- Self-closing tags -->
<img src="photo.jpg">
<br>`
            },

            {
                type: 'exercise',
                section: 'basics',
                title: 'Practice: Match the Tags',
                exercise: 'Write the correct closing tag for each opening tag: <code>&lt;p&gt;</code> <code>&lt;h2&gt;</code> <code>&lt;div&gt;</code>',
                hint: 'Remember: closing tags have a forward slash: </tagname>'
            },

            // HTML Elements
            {
                type: 'explain',
                section: 'basics',
                title: 'HTML Elements',
                content: [
                    'An element = opening tag + content + closing tag',
                    'Some elements have <span class="accent">no content</span> (self-closing)',
                    'Elements can be <span class="accent">nested</span> inside other elements'
                ]
            },

            {
                type: 'code',
                section: 'basics',
                title: 'Nested Elements',
                code: `<body>
  <h1>Welcome</h1>
  <p>
    This is <b>important</b> text.
  </p>
</body>`
            },

            {
                type: 'exercise',
                section: 'basics',
                title: 'Practice: Build a Paragraph',
                exercise: 'Create a paragraph element that contains one bold word and one italic word.',
                hint: 'Use <b> for bold and <i> for italic.'
            },

            // HTML Attributes
            {
                type: 'explain',
                section: 'basics',
                title: 'HTML Attributes',
                content: [
                    'Attributes add <span class="accent">extra information</span> to elements',
                    'They go in the <span class="accent">opening tag</span>',
                    'Format: <code>name="value"</code>'
                ],
                analogy: 'Attributes are like adjectives. Just as "red car" gives more info about the car, attributes give more info about HTML elements.',
                instructorNote: 'Common mistake: Forgetting quotes around attribute values. Always use quotes!'
            },

            {
                type: 'code',
                section: 'basics',
                title: 'Attributes in Action',
                code: `<img src="cat.jpg" alt="A cute cat">
<a href="https://google.com">Go to Google</a>
<p id="intro">Welcome to my site!</p>`
            },

            {
                type: 'exercise',
                section: 'basics',
                title: 'Practice: Add Attributes',
                exercise: 'Add an id attribute with value "main-title" to an h1 element.',
                hint: 'The format is: id="main-title"'
            },

            // === SECTION: DISPLAY & GROUPING ===
            {
                type: 'section',
                title: 'HTML Display & Grouping',
                subtitle: 'Inline vs block elements, div/span, and grouped tag knowledge',
                section: 'layout'
            }, {
                type: 'explain',
                section: 'layout',
                title: 'HTML Inline vs Block',
                content: [
                    'Block elements start on a new line and take full width by default (like <code>div</code>, <code>p</code>, <code>h1</code>, <code>section</code>).',
                    'Inline elements stay on the same line and use only needed width (like <code>span</code>, <code>a</code>, <code>strong</code>, <code>em</code>).',
                    'You can change behavior with CSS: <code>display: block</code>, <code>display: inline</code>, or <code>display: inline-block</code>.'
                ],
                analogy: 'Think of block elements as full-width shelves, and inline elements as books placed next to each other on the same shelf.'
            }, {
                type: 'code',
                section: 'layout',
                title: 'Inline vs Block Example',
                code: `<div>Block 1</div>
<div>Block 2</div>

<span>Inline A</span>
<span>Inline B</span>
<a href="#">Inline link</a>`
            }, {
                type: 'explain',
                section: 'layout',
                title: 'HTML Div and Span',
                content: [
                    '<code>div</code> is a generic block container used to group larger sections of content.',
                    '<code>span</code> is a generic inline container used to style or target small parts of text.',
                    'Use <code>div</code> for layout groups and <code>span</code> for inline text highlights.'
                ],
                instructorNote: 'Rule of thumb: if it should break to a new line, start with div; if it should stay inside a sentence, use span.'
            }, {
                type: 'code',
                section: 'layout',
                title: 'Div and Span Example',
                code: `<div class="card">
  <h3>Product Title</h3>
  <p>Price: <span class="accent-warm">$49</span></p>
</div>`
            }, {
                type: 'explain',
                section: 'layout',
                title: 'HTML Tags + Attributes Summary',
                content: [
                    'Structure tags: <code>html</code>, <code>head</code>, <code>body</code>, <code>header</code>, <code>main</code>, <code>section</code>, <code>article</code>, <code>footer</code>.',
                    'Text tags: <code>h1-h6</code>, <code>p</code>, <code>strong</code>, <code>em</code>, <code>small</code>, <code>mark</code>.',
                    'Inline/media tags: <code>a</code>, <code>span</code>, <code>img</code>, <code>video</code>, <code>audio</code>, <code>code</code>.',
                    'List/table tags: <code>ul</code>, <code>ol</code>, <code>li</code>, <code>table</code>, <code>tr</code>, <code>th</code>, <code>td</code>.',
                    'Form tags: <code>form</code>, <code>label</code>, <code>input</code>, <code>select</code>, <code>textarea</code>, <code>button</code>.'
                ]
            }, {
                type: 'explain',
                section: 'layout',
                title: 'Common Attributes (One by One)',
                content: [
                    '<code>id</code>: unique identifier for one element.',
                    '<code>class</code>: reusable group name for CSS and JavaScript.',
                    '<code>title</code>: extra hint text usually shown on hover.',
                    '<code>href</code>: destination URL used in links.',
                    '<code>src</code>: source path used by images and media.',
                    '<code>alt</code>: text alternative for images (accessibility).',
                    '<code>name</code>: key sent with form data.',
                    '<code>value</code>: current or default value for form controls.',
                    '<code>required</code>: blocks submit if the field is empty.',
                    '<code>placeholder</code>: hint text displayed inside inputs.',
                    '<code>for</code>: connects <code>label</code> to input by id.',
                    '<code>action</code> + <code>method</code>: where and how form data is submitted.'
                ]
            }, {
                type: 'exercise',
                section: 'layout',
                title: 'Practice: Group Tags and Attributes',
                exercise: 'Create one mini page using: 2 block tags, 2 inline tags, one div, one span, and a form field that uses name, placeholder, and required.',
                hint: 'After writing code, explain why each chosen tag is block or inline.'
            },

            // === SECTION: TEXT & HEADINGS ===
            {
                type: 'section',
                title: 'Text & Headings',
                subtitle: 'Organizing and styling your content',
                section: 'text'
            },

            // Headings
            {
                type: 'explain',
                section: 'text',
                title: 'HTML Headings',
                content: [
                    'HTML has <span class="accent">6 levels</span> of headings: h1 to h6',
                    '<code>h1</code> is the largest and most important',

            'When you forget a tag or attribute, come back to this final summary. Everything listed here is exactly what you used in this formation.': 'عندما تنسى وسمًا أو خاصية، ارجع إلى هذا الملخص النهائي. كل ما هنا هو بالضبط ما استخدمته في هذه الدورة.',

            'Build one page that includes:\n- semantic layout (header, nav, main, section, article, footer)\n- headings, paragraphs, text formatting, and comments\n- links, images with alt text, video + audio with controls\n- unordered/ordered lists and one table\n- one complete form with validation attributes\n- clear use of div for blocks and span for inline highlights': 'أنشئ صفحة واحدة تحتوي على:\n- هيكل دلالي (header وnav وmain وsection وarticle وfooter)\n- عناوين وفقرات وتنسيق نصوص وتعليقات\n- روابط وصور مع alt وفيديو + صوت مع controls\n- قوائم مرتبة/غير مرتبة وجدول واحد\n- نموذجًا كاملًا مع خصائص التحقق\n- استخدامًا واضحًا لـ div للكتل وspan للإبراز داخل السطر',
            'Follow these steps:\n1) Start with basic page setup: doctype, html, head, meta, title, body.\n2) Build semantic layout: header + nav, then main with sections/articles, and footer.\n3) Add content blocks: headings, paragraphs, formatted text, and comments in code.\n4) Add navigation links and at least 2 images with clear alt text.\n5) Add media: one video and one audio with controls and proper source tags.\n6) Add one unordered list, one ordered list, and one table with headers.\n7) Build a contact form with labels and validation attributes (required, placeholder, min/max or pattern).\n8) Final check before submit: all tags closed, indentation clean, page readable, and no missing alt/label.': 'اتبع هذه الخطوات:\n1) ابدأ بإعداد الصفحة الأساسي: doctype وhtml وhead وmeta وtitle وbody.\n2) ابنِ الهيكل الدلالي: header مع nav، ثم main مع sections/articles، ثم footer.\n3) أضف كتل المحتوى: عناوين وفقرات وتنسيق نصوص وتعليقات داخل الكود.\n4) أضف روابط التنقل وصورتين على الأقل مع نص alt واضح.\n5) أضف الوسائط: فيديو واحد وصوت واحد مع controls ووسوم source الصحيحة.\n6) أضف قائمة غير مرتبة وقائمة مرتبة وجدولًا واحدًا بعناوين واضحة.\n7) ابنِ نموذج تواصل مع labels وخصائص تحقق (required وplaceholder وmin/max أو pattern).\n8) فحص نهائي قبل التسليم: إغلاق كل الوسوم، تنسيق مرتب، صفحة مقروءة، وعدم نسيان alt أو label.'
        };

        function t(text) {
            if (currentLang !== 'ar') return text;
            return arMap[text] || text;
        }

        function localizeSlide(slide) {
            if (currentLang !== 'ar') return slide;
            const out = {
                ...slide
            };

            if (out.title) out.title = t(out.title);
            if (out.subtitle) out.subtitle = t(out.subtitle);
            if (out.analogy) out.analogy = t(out.analogy);
            if (out.instructorNote) out.instructorNote = t(out.instructorNote);
            if (out.exercise) out.exercise = t(out.exercise);
            if (out.hint) out.hint = t(out.hint);
            if (Array.isArray(out.content)) out.content = out.content.map(item => t(item));

            return out;
        }

        // Render slides
        function renderSlides() {
            container.innerHTML = '';

            slides.forEach((slide, index) => {
                const localized = localizeSlide(slide);
                const slideEl = document.createElement('div');
                slideEl.className = 'slide';
                slideEl.setAttribute('role', 'group');
                slideEl.setAttribute('aria-label', `Slide ${index + 1} of ${slides.length}`);

                if (index === currentSlide) {
                    slideEl.classList.add('active');
                } else if (index < currentSlide) {
                    slideEl.classList.add('prev');
                }

                slideEl.innerHTML = renderSlideContent(localized, index);
                container.appendChild(slideEl);
            });

            updateNav();
            document.body.classList.toggle('lang-ar', currentLang === 'ar');
        }

        function renderSlideContent(slide, index) {
            switch (slide.type) {
                case 'title':
                    return `
            <div class="slide-content text-center">
              <div class="section-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
              </div>
              <h1 class="section-title">${slide.title}</h1>
              <p class="section-subtitle">${slide.subtitle}</p>
                            <p style="margin-top: 3rem; color: var(--muted);">${uiText[currentLang].startHint}</p>
            </div>
          `;

                case 'section':
                    return `
            <div class="slide-content text-center">
                            <p class="slide-number">${uiText[currentLang].section} ${getSectionNumber(slide.section)}</p>
              <h1 class="section-title">${slide.title}</h1>
              <p class="section-subtitle">${slide.subtitle}</p>
            </div>
          `;

                case 'explain':
                    return `
            <div class="slide-content">
              <p class="slide-number">${uiText[currentLang].explain}</p>
              <h2 class="slide-title">${slide.title}</h2>
              <ul class="bullet-list">
                ${slide.content.map(item => `<li>${item}</li>`).join('')}
              </ul>
              ${slide.analogy ? `
                <div class="analogy-box">
                                    <p class="analogy-label">${uiText[currentLang].realAnalogy}</p>
                  <p style="margin: 0; color: #c4b5fd;">${slide.analogy}</p>
                </div>
              ` : ''}
              ${slide.instructorNote ? `
                <div class="instructor-note">
                                    <strong>${uiText[currentLang].instructorNote}:</strong> ${slide.instructorNote}
                </div>
              ` : ''}
            </div>
          `;
        
        case 'code':
          return `
            <div class="slide-content">
              <p class="slide-number">${uiText[currentLang].codeExample}</p>
              <h2 class="slide-title">${slide.title}</h2>
              <div class="code-block">
                <pre style="margin: 0;"><code>${accentHTML(slide.code)}</code></pre>
              </div>
            </div>
          `;
        
        case 'exercise':
          return `
            <div class="slide-content">
              <p class="slide-number">${uiText[currentLang].practice}</p>
              <h2 class="slide-title">${slide.title}</h2>
              <div class="exercise-box">
                <p class="exercise-label">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                                    ${uiText[currentLang].handsOn}
                </p>
                <p style="margin: 0; font-size: 1.1rem;">${slide.exercise}</p>
              </div>
              ${slide.hint ? `
                <p style="margin-top: 1rem; color: var(--muted); font-size: 0.9rem;">
                                    <strong>${uiText[currentLang].hint}:</strong> ${slide.hint}
                </p>
              ` : ''}
            </div>
          `;
        
        case 'final':
          return `
            <div class="slide-content text-center">
              <div class="section-icon" style="background: linear-gradient(135deg, #22d3ee, #34d399);">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
              </div>
              <h1 class="section-title">${slide.title}</h1>
              <p class="section-subtitle" style="margin-bottom: 2rem;">${slide.subtitle}</p>
              <ul class="bullet-list" style="text-align: left; max-width: 500px; margin: 0 auto;">
                ${slide.content.map(item => `<li>${item}</li>`).join('')}
              </ul>
            </div>
          `;
        
        case 'challenge':
          return `
            <div class="slide-content">
              <p class="slide-number">${uiText[currentLang].finalChallenge}</p>
              <h2 class="slide-title">${slide.title}</h2>
              <p style="color: var(--muted); margin-bottom: 1.5rem;">${slide.subtitle}</p>
              <div class="exercise-box" style="background: linear-gradient(135deg, rgba(34, 211, 238, 0.1) 0%, rgba(52, 211, 153, 0.1) 100%); border-color: rgba(34, 211, 238, 0.3);">
                <p class="exercise-label" style="color: var(--accent);">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                    ${uiText[currentLang].finalProject}
                </p>
                <p style="margin: 0; font-size: 1rem; white-space: pre-line;">${slide.exercise}</p>
              </div>
            </div>
          `;
        
        default:
          return '';
      }
    }

        function getSectionNumber(section) {
                        const sections = ['start', 'basics', 'layout', 'text', 'links', 'media', 'lists', 'forms', 'semantic', 'reference'];
      const num = sections.indexOf(section);
      return num > 0 ? num : '';
    }

        function accentHTML(code) {
            const comments = [];

            let escaped = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            escaped = escaped.replace(/(&lt;!--[\s\S]*?--&gt;)/g, (match) => {
                const token = `__HTML_COMMENT_${comments.length}__`;
                comments.push(match);
                return token;
            });

            escaped = escaped.replace(/(&lt;\/?.*?&gt;)/g, (token) => {
                // Highlight attributes first on raw token text (before adding spans)
                let highlighted = token.replace(/(\s)([\w:-]+)(=)("[^"]*"|'[^']*')/g, '$1<span class="attr">$2</span>$3<span class="value">$4</span>');

                // Then highlight tag name; keeps generated span markup untouched
                highlighted = highlighted.replace(/^(&lt;\/?)([\w-]+)/, '$1<span class="tag">$2</span>');

                return highlighted;
            });

            comments.forEach((comment, index) => {
                escaped = escaped.replace(`__HTML_COMMENT_${index}__`, `<span class="comment">${comment}</span>`);
            });

            return escaped;
        }

    function updateNav() {
      const total = slides.length;
      const progress = ((currentSlide + 1) / total) * 100;
      
      progressFill.style.width = `${progress}%`;
      slideCounter.textContent = `${currentSlide + 1} / ${total}`;
      
      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === total - 1;
    }

    function goToSlide(index) {
      if (index < 0 || index >= slides.length) return;
      
      const allSlides = container.querySelectorAll('.slide');
      
      allSlides.forEach((slide, i) => {
        slide.classList.remove('active', 'prev');
        if (i === index) {
          slide.classList.add('active');
        } else if (i < index) {
          slide.classList.add('prev');
        }
      });
      
      currentSlide = index;
      updateNav();
    }

    function nextSlide() {
      goToSlide(currentSlide + 1);
    }

    function prevSlide() {
      goToSlide(currentSlide - 1);
    }

    // Event listeners
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            langToggleBtn.textContent = currentLang === 'en' ? 'AR' : 'EN';
            renderSlides();
            goToSlide(currentSlide);
        });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    // Touch support
    let touchStartX = 0;
    let touchEndX = 0;

    container.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    }

    // Initialize
    renderSlides();
    </script>
</body>
