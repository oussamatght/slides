<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git & GitHub Beginner Formation - Interactive Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #0a0f1a;
            --bg-end: #0b1220;
            --bg-card: #111827;
            --fg: #f1f5f9;
            --muted: #64748b;
            --accent: #22c55e;
            --accent-2: #22d3ee;
            --accent-warm: #fbbf24;
            --border: #1e293b;
            --code-bg: #111827;
            --details-bg: rgba(34, 197, 94, 0.08);
            --scroll-track: rgba(17, 24, 39, 0.72);
            --scroll-thumb-border: rgba(10, 15, 26, 0.75);
            --text-soft: #d8e2ee;
            --chip-border: rgba(34, 197, 94, 0.45);
            --chip-fg: #86efac;
            --chip-bg: rgba(34, 197, 94, 0.12);
            --panel-border: rgba(34, 197, 94, 0.35);
            --panel-title: #4ade80;
            --copy-border: rgba(34, 197, 94, 0.4);
            --copy-bg: rgba(34, 197, 94, 0.11);
            --copy-bg-hover: rgba(34, 197, 94, 0.2);
            --copy-fg: #86efac;
            --task-bg-a: rgba(251, 191, 36, 0.16);
            --task-bg-b: rgba(251, 191, 36, 0.07);
            --task-border: rgba(251, 191, 36, 0.42);
            --task-text: #dbe5f1;
            --hover-bg: rgba(34, 197, 94, 0.1);
        }
        
        body.theme-light {
            --bg: #f1f5f9;
            --bg-end: #dbeafe;
            --bg-card: #ffffff;
            --fg: #0f172a;
            --muted: #475569;
            --accent: #16a34a;
            --accent-2: #0891b2;
            --accent-warm: #d97706;
            --border: #cbd5e1;
            --code-bg: #f8fafc;
            --details-bg: rgba(22, 163, 74, 0.08);
            --scroll-track: rgba(203, 213, 225, 0.8);
            --scroll-thumb-border: rgba(241, 245, 249, 0.95);
            --text-soft: #334155;
            --chip-border: rgba(22, 163, 74, 0.35);
            --chip-fg: #15803d;
            --chip-bg: rgba(22, 163, 74, 0.12);
            --panel-border: rgba(22, 163, 74, 0.34);
            --panel-title: #15803d;
            --copy-border: rgba(22, 163, 74, 0.38);
            --copy-bg: rgba(22, 163, 74, 0.1);
            --copy-bg-hover: rgba(22, 163, 74, 0.16);
            --copy-fg: #166534;
            --task-bg-a: rgba(217, 119, 6, 0.14);
            --task-bg-b: rgba(217, 119, 6, 0.06);
            --task-border: rgba(217, 119, 6, 0.4);
            --task-text: #334155;
            --hover-bg: rgba(22, 163, 74, 0.1);
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            margin: 0;
            overflow: hidden;
        }
        
        code,
        pre,
        .code-block {
            font-family: 'JetBrains Mono', monospace;
        }
        
        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 197, 94, 0.16), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(34, 211, 238, 0.12), transparent), linear-gradient(180deg, var(--bg) 0%, var(--bg-end) 100%);
        }
        
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: linear-gradient(rgba(34, 211, 238, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        
        .slides-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 2rem 8rem;
            opacity: 0;
            transform: translateX(100px);
            transition: opacity 0.45s ease, transform 0.45s ease;
            pointer-events: none;
        }
        
        .slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        
        .slide.prev {
            transform: translateX(-100px);
        }
        
        @media (prefers-reduced-motion: reduce) {
            .slide {
                transition: opacity 0.2s ease;
                transform: none !important;
            }
        }
        
        .slide-content {
            max-width: 980px;
            width: 100%;
            max-height: calc(100vh - 12rem);
            overflow-y: auto;
            padding-right: 0.35rem;
        }
        
        .slide-content::-webkit-scrollbar {
            width: 9px;
        }
        
        .slide-content::-webkit-scrollbar-track {
            background: var(--scroll-track);
            border-radius: 999px;
        }
        
        .slide-content::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-2), var(--accent));
            border-radius: 999px;
            border: 2px solid var(--scroll-thumb-border);
        }
        
        .slide-number {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .slide-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, var(--fg) 0%, var(--accent-2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .section-title {
            font-size: clamp(2.4rem, 6vw, 4.4rem);
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .section-subtitle {
            font-size: 1.2rem;
            color: var(--muted);
            text-align: center;
        }
        
        .lead {
            color: var(--text-soft);
            line-height: 1.7;
            margin-bottom: 0.8rem;
            font-size: 1.03rem;
        }
        
        .chip-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1.35rem;
        }
        
        .chip {
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid var(--chip-border);
            color: var(--chip-fg);
            background: var(--chip-bg);
            border-radius: 999px;
            padding: 0.32rem 0.78rem;
        }
        
        .bullet-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .bullet-list li {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 0.92rem;
            font-size: 1.07rem;
            line-height: 1.55;
        }
        
        .bullet-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0.6em;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 2px;
            transform: rotate(45deg);
        }
        
        .bullet-list.compact li {
            font-size: 0.96rem;
            margin-bottom: 0.63rem;
        }
        
        .accent {
            color: var(--accent);
            font-weight: 600;
        }
        
        .accent-2 {
            color: var(--accent-2);
            font-weight: 600;
        }
        
        .module-panel {
            background: var(--details-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 0.45rem 0.85rem;
            margin-bottom: 0.75rem;
        }
        
        .module-panel summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--panel-title);
            padding: 0.5rem 0.2rem;
        }
        
        .module-panel[open] summary {
            margin-bottom: 0.35rem;
        }
        
        .module-panel p {
            margin: 0 0 0.55rem;
            color: var(--text-soft);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        .code-block {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.45rem;
            overflow-x: auto;
            font-size: 0.92rem;
            line-height: 1.72;
            position: relative;
        }
        
        .code-block::-webkit-scrollbar {
            height: 8px;
        }
        
        .code-block::-webkit-scrollbar-thumb {
            background: linear-gradient(90deg, var(--accent-2), var(--accent));
            border-radius: 999px;
        }
        
        .code-lang {
            position: absolute;
            top: 0.72rem;
            right: 1rem;
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }
        
        .copy-btn {
            position: absolute;
            top: 0.66rem;
            right: 4.1rem;
            border: 1px solid var(--copy-border);
            background: var(--copy-bg);
            color: var(--copy-fg);
            border-radius: 8px;
            font-size: 0.72rem;
            padding: 0.24rem 0.52rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .copy-btn:hover {
            background: var(--copy-bg-hover);
        }
        
        .task-box {
            margin-top: 1rem;
            background: linear-gradient(135deg, var(--task-bg-a), var(--task-bg-b));
            border: 1px solid var(--task-border);
            border-radius: 12px;
            padding: 1rem;
        }
        
        .task-title {
            margin: 0 0 0.55rem;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-warm);
            font-weight: 700;
        }
        
        .task-text {
            margin: 0;
            line-height: 1.6;
            font-size: 0.96rem;
            color: var(--task-text);
        }
        
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(to top, var(--bg), transparent);
            padding: 2rem;
        }
        
        .nav-inner {
            max-width: 980px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        
        .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-warm));
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.72rem 1.35rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--fg);
            font-family: inherit;
            font-size: 0.86rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .nav-btn:hover {
            border-color: var(--accent);
            background: var(--hover-bg);
        }
        
        .nav-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        
        .slide-counter {
            font-size: 0.84rem;
            color: var(--muted);
            min-width: 75px;
            text-align: center;
        }
        
        .keyboard-hint {
            position: fixed;
            bottom: 6rem;
            right: 2rem;
            font-size: 0.75rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        kbd {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            font-family: inherit;
            font-size: 0.7rem;
        }
        
        .section-icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 1.4rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        
        .top-controls {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 120;
            display: flex;
            gap: 0.55rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .control-btn {
            padding: 0.45rem 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--fg);
            font-family: inherit;
            font-size: 0.79rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .control-btn:hover {
            border-color: var(--accent);
            background: var(--hover-bg);
        }
        
        .lang-ar .slide-content {
            direction: rtl;
            text-align: right;
        }
        
        .lang-ar .bullet-list li {
            padding-left: 0;
            padding-right: 2rem;
        }
        
        .lang-ar .bullet-list li::before {
            left: auto;
            right: 0;
        }
        
        .lang-ar pre,
        .lang-ar code,
        .lang-ar .code-block {
            direction: ltr;
            text-align: left;
        }
        
        .lang-ar .code-lang {
            left: 1rem;
            right: auto;
        }
        
        .lang-ar .copy-btn {
            left: 4.1rem;
            right: auto;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .slide.active .slide-content>* {
            animation: fadeInUp 0.45s ease forwards;
        }
        
        .slide.active .slide-content>*:nth-child(1) {
            animation-delay: 0.08s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(2) {
            animation-delay: 0.16s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(3) {
            animation-delay: 0.24s;
            opacity: 0;
        }
        
        .slide.active .slide-content>*:nth-child(4) {
            animation-delay: 0.3s;
            opacity: 0;
        }
        
        @media (prefers-reduced-motion: reduce) {
            .slide.active .slide-content>* {
                animation: none;
                opacity: 1;
            }
        }
        
        @media (max-width: 760px) {
            .slide {
                padding: 1rem 1rem 8rem;
            }
            .slide-title {
                font-size: 1.75rem;
            }
            .section-title {
                font-size: clamp(1.9rem, 8vw, 2.7rem);
            }
            .section-subtitle {
                font-size: 1rem;
            }
            .bullet-list li {
                font-size: 0.95rem;
                padding-left: 1.5rem;
                margin-bottom: 0.68rem;
            }
            .code-block {
                font-size: 0.8rem;
                padding: 1rem;
            }
            .slide-content {
                max-height: calc(100vh - 11rem);
                padding-right: 0.2rem;
            }
            .nav-inner {
                flex-wrap: wrap;
                padding: 0.9rem;
            }
            .nav-btn {
                padding: 0.5rem 1rem;
                font-size: 0.75rem;
            }
            .slide-counter {
                font-size: 0.75rem;
            }
            .keyboard-hint {
                display: none;
            }
            .top-controls {
                top: 0.6rem;
                right: 0.6rem;
            }
            .control-btn {
                font-size: 0.72rem;
                padding: 0.36rem 0.6rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-pattern"></div>
    <div class="grid-overlay"></div>

    <div class="top-controls">
        <button id="langToggleBtn" class="control-btn" aria-label="Toggle Arabic language">AR</button>
        <button id="themeToggleBtn" class="control-btn" aria-label="Toggle light and dark mode">☀️ Light</button>
    </div>

    <div class="slides-container" id="slidesContainer"></div>

    <div class="keyboard-hint" id="keyboardHint">
        <kbd>←</kbd> <kbd>→</kbd> to navigate
    </div>

    <nav class="nav-bar" role="navigation" aria-label="Slide navigation">
        <div class="nav-inner">
            <button class="nav-btn" id="prevBtn" aria-label="Previous slide">
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="15 18 9 12 15 6"></polyline>
				</svg>
				<span id="prevLabel">Prev</span>
			</button>
            <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Slide progress">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="slide-counter" id="slideCounter">1 / 1</span>
            <button class="nav-btn" id="nextBtn" aria-label="Next slide">
				<span id="nextLabel">Next</span>
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="9 18 15 12 9 6"></polyline>
				</svg>
			</button>
        </div>
    </nav>

    <script>
        const bi = (en, ar) => ({
            en,
            ar
        });

        const uiText = {
            en: {
                section: 'Section',
                module: 'Module',
                codeExample: 'Code Example',
                task: 'Practice Task',
                nextSteps: 'Next Steps',
                copy: 'Copy',
                copied: 'Copied!',
                prev: 'Prev',
                next: 'Next',
                keyboardHint: 'to navigate',
                startHint: 'Press → or click Next to begin',
                light: '☀️ Light',
                dark: '🌙 Dark'
            },
            ar: {
                section: 'القسم',
                module: 'الوحدة',
                codeExample: 'مثال كود',
                task: 'تمرين عملي',
                nextSteps: 'الخطوات التالية',
                copy: 'نسخ',
                copied: 'تم النسخ!',
                prev: 'السابق',
                next: 'التالي',
                keyboardHint: 'للتنقّل',
                startHint: 'اضغط ←/→ أو انقر التالي للبدء',
                light: '☀️ فاتح',
                dark: '🌙 داكن'
            }
        };

        const slides = [{
                type: 'title',
                title: bi('🎓 Full Beginner Formation: Git & GitHub', '🎓 تكوين المبتدئين الكامل: Git و GitHub'),
                subtitle: bi('Interactive + Practical + Bilingual (EN/AR)', 'تفاعلي + عملي + ثنائي اللغة (إنجليزي/عربي)'),
                description: bi('Same logic and UI/UX as your other formations, with extra features: dark/light mode, collapsible sections, and copy buttons for commands.', 'نفس المنطق وتجربة المستخدم مثل باقي التكوينات، مع ميزات إضافية: وضع فاتح/داكن، أقسام قابلة للطي، وزر نسخ للأوامر.'),
                chips: ['Git Basics', 'GitHub Workflow', 'Branches', 'Pull Requests', 'Best Practices']
            }, {
                type: 'section',
                title: bi('Formation Roadmap', 'خريطة التكوين'),
                subtitle: bi('8 core modules + examples + tasks', '8 وحدات أساسية + أمثلة + تمارين')
            }, {
                type: 'content',
                label: bi('Index', 'الفهرس'),
                title: bi('What You Will Learn', 'ماذا ستتعلم'),
                bullets: [
                    bi('🧩 Module 1 — Introduction', '🧩 الوحدة 1 — المقدمة'),
                    bi('💻 Module 2 — Install & Setup', '💻 الوحدة 2 — التثبيت والإعداد'),
                    bi('📁 Module 3 — Basic Git Commands', '📁 الوحدة 3 — أوامر Git الأساسية'),
                    bi('🌐 Module 4 — Connect to GitHub', '🌐 الوحدة 4 — الربط مع GitHub'),
                    bi('🔄 Module 5 — Daily Workflow', '🔄 الوحدة 5 — سير العمل اليومي'),
                    bi('🌿 Module 6 — Branching', '🌿 الوحدة 6 — التفرعات'),
                    bi('🤝 Module 7 — Collaboration', '🤝 الوحدة 7 — التعاون'),
                    bi('🧠 Module 8 — Best Practices', '🧠 الوحدة 8 — أفضل الممارسات')
                ]
            },

            // Module 1
            {
                type: 'section',
                title: bi('🧩 Module 1 — Introduction', '🧩 الوحدة 1 — المقدمة'),
                subtitle: bi('Version control fundamentals', 'أساسيات التحكم في الإصدارات')
            }, {
                type: 'module',
                title: bi('What is Version Control?', 'ما هو التحكم في الإصدارات؟'),
                lead: bi('Version control tracks project history so you can collaborate safely, recover mistakes, and understand what changed over time.', 'التحكم في الإصدارات يتتبع تاريخ المشروع لتتعاون بأمان، وتسترجع الأخطاء، وتفهم ما الذي تغير مع الوقت.'),
                panels: [{
                    title: bi('Core Concepts', 'المفاهيم الأساسية'),
                    items: [
                        bi('Git stores snapshots of your files as commits.', 'Git يحفظ لقطات من الملفات على شكل commits.'),
                        bi('Each commit has a message, author, and timestamp.', 'كل commit يحتوي رسالة واسم الكاتب والوقت.'),
                        bi('You can move backward/forward in project history.', 'يمكنك الرجوع للأمام أو للخلف في تاريخ المشروع.'),
                        bi('You work locally first, then sync with remote repositories.', 'تعمل محليًا أولًا ثم تزامن مع المستودعات البعيدة.')
                    ]
                }, {
                    title: bi('Git vs GitHub', 'الفرق بين Git و GitHub'),
                    items: [
                        bi('Git = version control tool on your machine.', 'Git = أداة التحكم في الإصدارات على جهازك.'),
                        bi('GitHub = platform to host repositories online and collaborate.', 'GitHub = منصة لاستضافة المستودعات والتعاون عبر الإنترنت.'),
                        bi('You can use Git without GitHub, but teams usually use both.', 'يمكنك استخدام Git بدون GitHub، لكن الفرق عادةً تستخدم الاثنين.')

        const container = document.getElementById('slidesContainer');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const prevLabel = document.getElementById('prevLabel');
        const nextLabel = document.getElementById('nextLabel');
        const progressFill = document.getElementById('progressFill');
        const slideCounter = document.getElementById('slideCounter');
        const langToggleBtn = document.getElementById('langToggleBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const keyboardHint = document.getElementById('keyboardHint');

        let currentSlide = 0;
        let currentLang = localStorage.getItem('git-formation-lang') || 'en';
        let currentTheme = localStorage.getItem('git-formation-theme') || 'dark';

        function t(value) {
            if (value === null || value === undefined) return '';
            if (typeof value === 'object' && value.en !== undefined && value.ar !== undefined) {
                return currentLang === 'ar' ? value.ar : value.en;
            }
            return value;
        }

        function escapeHtml(input) {
            return input
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function renderSlides() {
            container.innerHTML = '';

            slides.forEach((slide, index) => {
                const slideEl = document.createElement('div');
                slideEl.className = 'slide';
                slideEl.setAttribute('role', 'group');
                slideEl.setAttribute('aria-label', `Slide ${index + 1} of ${slides.length}`);

                if (index === currentSlide) {
                    slideEl.classList.add('active');
                } else if (index < currentSlide) {
                    slideEl.classList.add('prev');
                }

                slideEl.innerHTML = renderSlideContent(slide);
                container.appendChild(slideEl);
            });

            document.body.classList.toggle('lang-ar', currentLang === 'ar');
            updateControlsText();
            updateNav();
        }

        function renderSlideContent(slide) {
            switch (slide.type) {
                case 'title':
                    return `
						<div class="slide-content text-center">
							<div class="section-icon">

		}

		function updateNav() {
			const total = slides.length;
			const progress = ((currentSlide + 1) / total) * 100;

			progressFill.style.width = `${progress}%`;
			slideCounter.textContent = `${currentSlide + 1} / ${total}`;

			prevBtn.disabled = currentSlide === 0;
			nextBtn.disabled = currentSlide === total - 1;
		}

		function updateControlsText() {
			prevLabel.textContent = uiText[currentLang].prev;
			nextLabel.textContent = uiText[currentLang].next;
			langToggleBtn.textContent = currentLang === 'en' ? 'AR' : 'EN';
			themeToggleBtn.textContent = currentTheme === 'dark' ? uiText[currentLang].light : uiText[currentLang].dark;
			keyboardHint.innerHTML = `<kbd>←</kbd> <kbd>→</kbd> ${uiText[currentLang].keyboardHint}`;
		}

		function goToSlide(index) {
			if (index < 0 || index >= slides.length) return;

			const allSlides = container.querySelectorAll('.slide');

			allSlides.forEach((slideEl, i) => {
				slideEl.classList.remove('active', 'prev');
				if (i === index) {
					slideEl.classList.add('active');
				} else if (i < index) {
					slideEl.classList.add('prev');
				}
			});

			currentSlide = index;
			updateNav();
		}

		function nextSlide() {
			goToSlide(currentSlide + 1);
		}

		function prevSlide() {
			goToSlide(currentSlide - 1);
		}

		function setTheme(theme) {
			currentTheme = theme;
			document.body.classList.toggle('theme-light', theme === 'light');
			localStorage.setItem('git-formation-theme', theme);
			updateControlsText();
		}

		async function copyToClipboard(text) {
			try {
				await navigator.clipboard.writeText(text);
				return true;
			} catch {
				const textarea = document.createElement('textarea');
				textarea.value = text;
				document.body.appendChild(textarea);
				textarea.select();
				const ok = document.execCommand('copy');
				document.body.removeChild(textarea);
				return ok;
			}
		}

		prevBtn.addEventListener('click', prevSlide);
		nextBtn.addEventListener('click', nextSlide);

		langToggleBtn.addEventListener('click', () => {
			currentLang = currentLang === 'en' ? 'ar' : 'en';
			localStorage.setItem('git-formation-lang', currentLang);
			renderSlides();
			goToSlide(currentSlide);
		});

		themeToggleBtn.addEventListener('click', () => {
			setTheme(currentTheme === 'dark' ? 'light' : 'dark');
		});

		document.addEventListener('click', async(event) => {
			const btn = event.target.closest('.copy-btn');
			if (!btn) return;

			const codeEl = btn.closest('.code-block')?.querySelector('code');
			if (!codeEl) return;

			const rawCode = codeEl.textContent || '';
			const success = await copyToClipboard(rawCode);
			const original = btn.textContent;

			btn.textContent = success ? uiText[currentLang].copied : 'Copy failed';
			setTimeout(() => {
				btn.textContent = original;
			}, 1200);
		});

		document.addEventListener('keydown', (event) => {
			if (event.key === 'ArrowRight' || event.key === ' ') {
				event.preventDefault();
				nextSlide();
			} else if (event.key === 'ArrowLeft') {
				event.preventDefault();
				prevSlide();
			}
		});

		let touchStartX = 0;
		let touchEndX = 0;

		container.addEventListener('touchstart', (event) => {
			touchStartX = event.changedTouches[0].screenX;
		}, {
			passive: true
		});

		container.addEventListener('touchend', (event) => {
			touchEndX = event.changedTouches[0].screenX;
			const diff = touchStartX - touchEndX;

			if (Math.abs(diff) > 50) {
				if (diff > 0) nextSlide();
				else prevSlide();
			}
		}, {
			passive: true
		});

		setTheme(currentTheme);
		renderSlides();
    </script>
</body>

</html>
